[project]
name = "monitor-control"
version = "0.3.0"
description = "Local monitor control via ddcutil"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich >=13.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
monitorctl = "monitor_control.cli:app"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_any_generics = true
disallow_untyped_defs = true
check_untyped_defs = true
pretty = true
exclude = "(monitor_control/ui/|monitor_control/ui_tray/)"


# Typer/Rich can be noisy depending on versions; keep this targeted:
[[tool.mypy.overrides]]
module = ["rich.*", "typer.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"monitor_control/ui/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]